name: iOS — TestFlight Deploy

on:
  push:
    branches: [main, claude/prv-house-vision-bjnc7z, claude/prv-house-vision-rh9ezh, claude/session-inquiry-2oqlz0]
    paths:
      - 'apps/ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Upload to TestFlight
    # Uploads are on-demand only (owner's call) — pushes run just the tests.
    # Trigger from the Actions tab (Run Workflow), or push a commit whose
    # message carries the [deploy] marker (the API dispatch needs a
    # permission this integration doesn't have — confirmed 403, 2026-08-02).
    # Retrigger law: an EMPTY commit does NOT start a run — the `paths`
    # filter above requires touching apps/ios/** or this file. A retry must
    # carry a real change to one of those paths.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy]')
    runs-on: xcode-27
    timeout-minutes: 45

    defaults:
      run:
        working-directory: apps/ios

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: apps/ios

      - name: Install XcodeGen
        run: brew install xcodegen

      # Current cycle toolchain (WWDC26 → iOS/watchOS 27 SDKs). The
      # `macos-26` image tops out at Xcode 26.6 (26.5 SDKs); the `xcode-27`
      # image carries 27.x. `Xcode_27.1.app` is the image's stable symlink
      # (the folder behind it moves from RC to final); 27.0 is the fallback.
      - name: Select Xcode 27
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app || sudo xcode-select -s /Applications/Xcode_27.app
          xcodebuild -version

      - name: Install iOS platform
        run: |
          xcodebuild -version
          for i in 1 2 3; do
            sudo xcodebuild -downloadPlatform iOS && sudo xcodebuild -downloadPlatform watchOS && break
            echo "downloadPlatform attempt $i failed, retrying..."
            sleep 10
          done || echo "downloadPlatform failed; continuing — platform is usually preinstalled"

      # The full Ruby patch version (e.g. 3.3.12) scopes the gem cache below.
      # Native gems (json's parser.bundle) are linked against the runner's
      # libruby dylib; when GitHub bumps the patch (3.3.11 -> 3.3.12) a cache
      # keyed only on Gemfile.lock restores extensions built for the old dylib,
      # and `require 'json'` dies with "linked to incompatible libruby". Keying
      # (and the restore-keys fallback) on the Ruby version rebuilds them.
      - name: Ruby version for cache key
        id: rubyver
        run: echo "v=$(ruby -e 'print RUBY_VERSION')" >> "$GITHUB_OUTPUT"

      - name: Cache Gems
        uses: actions/cache@v4
        with:
          path: apps/ios/vendor/bundle
          key: gems-${{ steps.rubyver.outputs.v }}-${{ hashFiles('apps/ios/Gemfile.lock') }}
          restore-keys: gems-${{ steps.rubyver.outputs.v }}-

      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ hashFiles('apps/ios/project.yml') }}
          restore-keys: spm-

      - name: Cache DerivedData (SPM compiled modules)
        uses: actions/cache@v4
        with:
          path: /tmp/DerivedData/SourcePackages
          key: dd-spm-${{ hashFiles('apps/ios/project.yml') }}
          restore-keys: dd-spm-

      - name: Install Gems
        run: |
          bundle config set path vendor/bundle
          bundle install

      - name: Run Fastlane beta
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          IOS_DIST_CERTIFICATE_BASE64: ${{ secrets.IOS_DIST_CERTIFICATE_BASE64 }}
          IOS_DIST_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DIST_CERTIFICATE_PASSWORD }}
        run: bundle exec fastlane beta

  test:
    name: Unit Tests
    runs-on: xcode-27
    timeout-minutes: 35

    defaults:
      run:
        working-directory: apps/ios

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      # Current cycle toolchain (WWDC26 → iOS/watchOS 27 SDKs). The
      # `macos-26` image tops out at Xcode 26.6 (26.5 SDKs); the `xcode-27`
      # image carries 27.x. `Xcode_27.1.app` is the image's stable symlink
      # (the folder behind it moves from RC to final); 27.0 is the fallback.
      - name: Select Xcode 27
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app || sudo xcode-select -s /Applications/Xcode_27.app
          xcodebuild -version

      - name: Install iOS platform
        run: |
          xcodebuild -version
          for i in 1 2 3; do
            sudo xcodebuild -downloadPlatform iOS && sudo xcodebuild -downloadPlatform watchOS && break
            echo "downloadPlatform attempt $i failed, retrying..."
            sleep 10
          done || echo "downloadPlatform failed; continuing — platform is usually preinstalled"

      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ hashFiles('apps/ios/project.yml') }}
          restore-keys: spm-

      - name: Generate project
        run: xcodegen generate

      - name: Run unit tests on a simulator
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -E "iPhone" | head -1 | sed -E 's/^ *(.+) \([0-9A-Fa-f-]+\) \(.*/\1/' | xargs)
          if [ -z "$DEVICE" ]; then echo "No iPhone simulator available"; exit 1; fi
          echo "Using simulator: $DEVICE"
          set -o pipefail
          xcodebuild test \
            -project PRVIO.xcodeproj \
            -scheme PRVIO \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -derivedDataPath /tmp/TestDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | awk '/Test Suite|Test Case|error:|\*\* TEST/'
          # awk is display-only and always exits 0, so with pipefail the
          # step's verdict is xcodebuild's real exit code — never swallowed.
